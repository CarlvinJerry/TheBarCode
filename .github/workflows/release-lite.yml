name: Build and publish TheBarcode Lite

on:
  push:
    branches: [develop]
    paths-ignore:
      - release/latest.json
      - docs/**
      - README.md

permissions:
  contents: write

concurrency:
  group: thebarcode-lite-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == 'develop'
    runs-on: windows-latest
    steps:
      - name: Check out develop branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate the next patch version
        id: version
        shell: pwsh
        run: |
          $currentText = (Get-Content -Raw VERSION).Trim()
          if ($currentText -notmatch '^\d+\.\d+\.\d+$') { throw 'VERSION must use MAJOR.MINOR.PATCH.' }
          $latestTag = gh release list --limit 1 --json tagName | ConvertFrom-Json | Select-Object -First 1 -ExpandProperty tagName -ErrorAction SilentlyContinue
          $publishedVersions = @()
          if ($latestTag -match '^v(\d+\.\d+\.\d+)$') {
            $publishedVersions += [version]::Parse($Matches[1])
          }
          if (Test-Path -LiteralPath 'release/latest.json') {
            $localFeed = Get-Content -Raw 'release/latest.json' | ConvertFrom-Json
            if ($localFeed.version -match '^\d+\.\d+\.\d+$') { $publishedVersions += [version]::Parse($localFeed.version) }
          }
          $releaseRef = git ls-remote --heads origin refs/heads/release
          if ($LASTEXITCODE -eq 0 -and $releaseRef) {
            git fetch origin release
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the release branch version.' }
            $feedJson = git show origin/release:release/latest.json
            if ($LASTEXITCODE -eq 0 -and $feedJson) {
              $feed = ($feedJson -join "`n") | ConvertFrom-Json
              if ($feed.version -match '^\d+\.\d+\.\d+$') { $publishedVersions += [version]::Parse($feed.version) }
            }
          }
          if ($publishedVersions.Count -gt 0) {
            $base = $publishedVersions | Sort-Object -Descending | Select-Object -First 1
          } else {
            $base = [version]::Parse($currentText)
          }
          $version = '{0}.{1}.{2}' -f $base.Major, $base.Minor, ($base.Build + 1)
          $tagRange = if ($latestTag -and (git rev-parse --verify "refs/tags/$latestTag" 2>$null)) { "$latestTag..$env:GITHUB_SHA" } else { $env:GITHUB_SHA }
          $subjects = @(git log $tagRange --format=%s)
          $summaryParts = @($subjects | Where-Object { $_ -and $_ -notmatch '^(chore\(release\):|Publish Lite update manifest|ci:)' } | Select-Object -First 3)
          $summary = if ($summaryParts.Count) { "TheBarcode Lite $version: " + ($summaryParts -join '; ') } else { "TheBarcode Lite $version includes improvements and fixes." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "summary=$summary" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $iscc) { choco install innosetup --yes --no-progress }

      - name: Build Lite installer
        shell: pwsh
        run: ./scripts/build-lite-installer.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Publish GitHub release and installer
        id: publish
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $installer = "installer/output/TheBarcode-Lite-Setup-$version-x64.exe"
          if (-not (Test-Path -LiteralPath $installer)) { throw "Installer artifact missing: $installer" }
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer).Hash.ToLowerInvariant()
          $summary = $env:RELEASE_SUMMARY
          $releaseSourceSha = $env:GITHUB_SHA
          $notesPath = Join-Path $env:RUNNER_TEMP 'thebarcode-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value "$summary`n`nSource commit: $env:GITHUB_SHA`nRelease source: $releaseSourceSha" -Encoding utf8
          gh release create $tag $installer --title "TheBarcode Lite $version" --notes-file $notesPath --target $releaseSourceSha
          if ($LASTEXITCODE -ne 0) { throw "GitHub release $tag could not be published." }
          $manifest = [ordered]@{
            version = $version
            channel = 'lite-windows'
            edition = 'Lite'
            summary = $summary
            downloadUrl = "https://github.com/CarlvinJerry/TheBarCode/releases/download/$tag/TheBarcode-Lite-Setup-$version-x64.exe"
            sha256 = $sha256
            notes = @($summary)
          }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath 'release/latest.json' -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $remoteRelease = git ls-remote --heads origin refs/heads/release
          if ($LASTEXITCODE -eq 0 -and $remoteRelease) {
            git fetch origin release
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the release branch.' }
            git checkout -B release origin/release
            if ($LASTEXITCODE -ne 0) { throw 'Could not switch to the release branch.' }
            git merge --no-ff $releaseSourceSha -m "Release TheBarcode Lite $version"
            if ($LASTEXITCODE -ne 0) { throw 'Could not promote the built develop revision to release.' }
          } else {
            git checkout -b release $releaseSourceSha
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the release branch from develop.' }
          }
          $version = '${{ steps.version.outputs.version }}'
          Set-Content -LiteralPath 'VERSION' -Value $version -NoNewline -Encoding utf8
          $source = Get-Content -Raw -LiteralPath 'apps/web/src/version.ts'
          $line = 'export const APP_VERSION = import.meta.env.VITE_APP_VERSION || "' + $version + '";'
          $source = [regex]::new('export const APP_VERSION = import\.meta\.env\.VITE_APP_VERSION \|\| "[^"]+";').Replace($source, $line, 1)
          Set-Content -LiteralPath 'apps/web/src/version.ts' -Value $source -Encoding utf8
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath 'release/latest.json' -Encoding utf8
          git add release/latest.json
          git add VERSION apps/web/src/version.ts
          git commit -m "Release TheBarcode Lite $version"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit the latest update manifest.' }
          git push origin HEAD:release
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish latest.json to the release branch.' }
          "sha256=$sha256" >> $env:GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SUMMARY: ${{ steps.version.outputs.summary }}
