services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: ["5432:5432"]
    volumes: [thebarcode-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./apps/api
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Bootstrap__AdminPin: ${BOOTSTRAP_ADMIN_PIN}
      AllowedOrigins__0: http://localhost:${APP_PORT:-8088}
    expose: ["8080"]
    depends_on:
      postgres: { condition: service_healthy }
  web:
    build: ./apps/web
    ports: ["${APP_PORT:-8088}:80"]
    depends_on: [api]
volumes:
  thebarcode-postgres:
